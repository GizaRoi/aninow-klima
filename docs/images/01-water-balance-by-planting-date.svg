<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480"><rect width="880" height="480" fill="#f0f1e9"/><text x="74" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">WHEN TO PLANT</text><text x="74" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">Why plant straight after harvest: mungbean</text><text x="74" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">Median over 44 seasons, 50-day cycle. The shaded gap is the water someone must supply.</text><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="292.6" x2="730.0" y2="292.6" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="167.2" x2="730.0" y2="167.2" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="41.9" x2="730.0" y2="41.9" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="64.0" y="422.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0</text><text x="64.0" y="296.6" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">100</text><text x="64.0" y="171.2" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">200</text><text x="64.0" y="45.9" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">300</text><text x="74.0" y="438.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Nov 