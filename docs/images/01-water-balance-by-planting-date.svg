 x1="748.0" y1="115.0" x2="762.0" y2="115.0" stroke="#334c37" stroke-width="2.6"/><text x="768.0" y="119.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">rainfall</text><line x1="748.0" y1="135.0" x2="762.0" y2="135.0" stroke="#8c6928" stroke-width="2.6"/><text x="768.0" y="139.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">days over 35C</text><text x="82.0" y="116.7" font-size="11" fill="#223024" text-anchor="start" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">plant now: least to supply, no heat</text><text x="726.0" y="116.7" font-size="11" fill="#8c6928" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">plant late: more rain, but it cooks</text><text x="74.0" y="476.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Smallest shortfall: plant Nov 15, 44 mm short with 0 heat days. Late March looks similar on water alone but carries 40 days over the limit.</text></svg>