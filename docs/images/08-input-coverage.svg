  from 1981-01-01</text><rect x="74.0" y="290.3" width="656.0" height="24.1" fill="#334c37" fill-opacity="0.85"/><text x="65.0" y="306.3" font-size="12" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">GWETROOT</text><text x="737.0" y="306.3" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">100.0%  from 1981-01-01</text><rect x="74.0" y="336.5" width="612.3" height="24.1" fill="#8c6928" fill-opacity="0.85"/><text x="65.0" y="352.6" font-size="12" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">TOA_SW_DWN</text><text x="693.3" y="352.6" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">93.3%  from 1984-01-01</text><rect x="74.0" y="382.8" width="408.2" height="24.1" fill="#a05143" fill-opacity="0.85"/><text x="65.0" y="398.9" font-size="12" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">IMERG_PRECTOT</text><text x="489.2" y="398.9" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">62.2%  from 1998-01-01</text><text x="74.0" y="476.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Seasons missing a day of any variable the model needs are dropped from that statistic rather than filled in.</text></svg>