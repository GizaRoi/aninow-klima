<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480"><rect width="880" height="480" fill="#f0f1e9"/><text x="74" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">DATA TREATMENT</text><text x="74" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">What the inputs actually cover</text><text x="74" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">-999 is read as missing, never as zero. Reference ET needs radiation, so it cannot start before 1984.</text><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="74.0" y="438.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0%</text><text x="238.0" y="438.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">25%</text><text x="402.0" y="438.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">50%</text><text x="566.0" y="438.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">75%</text><text x="730.0" y="438.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">100%</text><text x="402.0" y="465.0" font-size="10.5" fill="#52614b" text-anchor="middle" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="1.4">SHARE OF DAYS PRESENT</text><line x1="238.0" y1="94.0" x2="238.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="402.0" y