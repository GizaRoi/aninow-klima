text><rect x="461.9" y="263.7" width="44.3" height="154.3" fill="#8c6928" fill-opacity="1.0"/><text x="484.0" y="256.7" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">10/21</text><text x="484.0" y="437.0" font-size="12.5" fill="#26392c" text-anchor="middle" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">tomato</text><rect x="573.4" y="418.0" width="44.3" height="0.0" fill="#52614b" fill-opacity="1.0"/><text x="595.5" y="411.0" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0/20</text><rect x="625.9" y="418.0" width="44.3" height="0.0" fill="#a05143" fill-opacity="1.0"/><text x="648.0" y="411.0" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0/21</text><text x="648.0" y="437.0" font-size="12.5" fill="#26392c" text-anchor="middle" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">rice</text><line x1="748.0" y1="95.0" x2="762.0" y2="95.0" stroke="#52614b" stroke-width="2.6"/><text x="768.0" y="99.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">1984-2003</text><line x1="748.0" y1="115.0" x2="762.0" y2="115.0" stroke="#334c37" stroke-width="2.6"/><text x="768.0" y="119.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">2004-2024</text><text x="74.0" y="476.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Rice passes 0 of 20 early seasons and 0 of 21 late ones. One figure for the whole record averages two different climates.</text></svg>