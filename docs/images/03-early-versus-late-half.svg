<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480"><rect width="880" height="480" fill="#f0f1e9"/><text x="74" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">HOW FAR TO TRUST IT</text><text x="74" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">The record is not one climate</text><text x="74" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">Seasons clearing the pass mark, first half against second half. Window rainfall rises 70 mm per decade (t = 4.1).</text><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="337.0" x2="730.0" y2="337.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="256.0" x2="730.0" y2="256.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="175.0" x2="730.0" y2="175.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="94.0" x2="730.0" y2="94.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="64.0" y="422.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0%</text><text x="64.0" y="341.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">25%</text><text x="64.0" y="260.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">50%</text><text x="64.0" y="179.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">75%</text><text x="64.0" y="98.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">100%</text><text x="17.0" y="256.0" font-size="10.5" fill="#52614b" text-anchor="middle" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="1.4" transform="rotate(-90 17.0 256.0)">SHARE OF SEASONS PASSING</text><rect x="81.4" y="123.5" width="44.3" height="294.5" fill="#52614b" fill-opacity="1.0"/><text x="103.5" y="116.5" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">20/22</text><rect x="133.9" y="108.7" width="44.3" height="309.3" fill="#334c37" fill-opacity="1.0"/><text x="156.0" y="101.7" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">21/22</text><text x="156.0" y="437.0" font-size="12.5" fill="#26392c" text-anchor="middle" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">mungbean</text><rect x="245.4" y="138.2" width="44.3" height="279.8" fill="#52614b" fill-opacity="1.0"/><text x="267.5" y="131.2" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">19/22</text><rect x="297.9" y="108.7" width="44.3" height="309.3" fill="#52614b" fill-opacity="1.0"/><text x="320.0" y="101.7" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">21/22</text><text x="320.0" y="437.0" font-size="12.5" fill="#26392c" text-anchor="middle" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">eggplant</text><rect x="409.4" y="138.2" width="44.3" height="279.8" fill="#52614b" fill-opacity="1.0"/><text x="431.5" y="131.2" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">19/22</text><rect x="461.9" y="108.7" width="44.3" height="309.3" fill="#8c6928" fill-opacity="1.0"/><text x="484.0" y="101.7" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">21/22</text><text x="484.0" y="437.0" font-size="12.5" fill="#26392c" text-anchor="middle" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">tomato</text><rect x="573.4" y="285.5" width="44.3" height="132.5" fill="#52614b" fill-opacity="1.0"/><text x="595.5" y="278.5" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">9/22</text><rect x="625.9" y="167.6" width="44.3" height="250.4" fill="#a05143" fill-opacity="1.0"/><text x="648.0" y="160.6" font-size="11.5" fill="#26392c" text-anchor="middle" font-weight="700" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">17/22</text><text x="648.0" y="437.0" font-size="12.5" fill="#26392c" text-anchor="middle" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">rice</text><line x1="748.0" y1="95.0" x2="762.0" y2="95.0" stroke="#52614b" stroke-width="2.6"/><text x="768.0" y="99.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">1981-2002</text><line x1="748.0" y1="115.0" x2="762.0" y2="115.0" stroke="#334c37" stroke-width="2.6"/><text x="768.0" y="119.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">2003-2024</text><text x="74.0" y="476.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Rice nearly doubles. Quoting one figure for all 44 seasons averages two different climates, and understates how rice has done recently.</text></svg>