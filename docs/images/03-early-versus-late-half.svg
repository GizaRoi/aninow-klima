<svg xmlns="http://www.w3.org/2000/svg" width="880" height="480" viewBox="0 0 880 480"><rect width="880" height="480" fill="#f0f1e9"/><text x="74" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">HOW FAR TO TRUST IT</text><text x="74" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">The record is not one climate</text><text x="74" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">Seasons clearing the pass mark, first half against second half. Window rainfall rises 70 mm per decade (t = 4.1).</text><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="337.0" x2="730.0" y2="337.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="256.0" x2="730.0" y2="256.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="175.0" x2="730.0" y2="175.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="94.0" x2="730.0" y2="94.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="418.0" x2="730.0" y2="418.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="64.0" y="422.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0%</text><text x="64.0" y="341.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">25%</text><text x="64.0" y="260.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">50%</text><text x="64.0" y="179.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">75%</text><text x="64.0" y="98.0" font-size="11.5" fill="#52614b"