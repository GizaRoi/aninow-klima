<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430"><rect width="880" height="430" fill="#f0f1e9"/><text x="150" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">WHERE THE NUMBER COMES FROM</text><text x="150" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">What actually decides the answer</text><text x="150" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">The weakest condition for each of 471 rated place-crop pairs. Suitability is that minimum, so this is what the score is made of.</text><rect x="150.0" y="116.4" width="638.9" height="30.0" fill="#075a32" fill-opacity="0.9"/><text x="138.0" y="136.4" font-size="13" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Soil pH</text><text x="797.9" y="136.4" font-size="12" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">195  (41%)</text><rect x="150.0" y="178.8" width="383.3" height="30.0" fill="#8c6928" fill-opacity="0.9"/><text x="138.0" y="198.8" font-size="13" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Temperature</text><text x="542.3" y="198.8" font-size="12" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">117  (25%)</text><rect x="150.0" y="241.2" width="350.6" height="30.0" fill="#334c37" fill-opacity="0.9"/><text x="138.0" y="261.2" font-size="13" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Water</text><text x="509.6" y="261.2" font-size="12" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">107  (23%)</text><rect x="150.0" y="303.6" width="170.4" height="30.0" fill="#52614b" fill-opacity="0.9"/><text x="138.0" y="323.6" font-size="13" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Soil texture</text><text x="329.4" y="323.6" font-size="12" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">52  (11%)</text><line x1="150.0" y1="356.0" x2="150.0" y2="94.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="150.0" y="426.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">If one bar held every pair the model would be a single-variable calculator wearing four names. It does not, so it is not.</text></svg>