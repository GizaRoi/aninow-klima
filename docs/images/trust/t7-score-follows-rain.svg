<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460"><rect width="880" height="460" fill="#f0f1e9"/><text x="74" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">WHERE THE MINIMUM IS DEGENERATE</text><text x="74" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">How often the score is really just rainfall</text><text x="74" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">Spearman's rho between a crop's season score and window rainfall, over 316 rated pairs. Median 0.73.</text><line x1="74.0" y1="392.0" x2="675.0" y2="392.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="329.8" x2="675.0" y2="329.8" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="267.7" x2="675.0" y2="267.7" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="205.5" x2="675.0" y2="205.5" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="143.3" x2="675.0" y2="143.3" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="81.2" x2="675.0" y2="81.2" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="392.0" x2="675.0" y2="392.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="64.0" y="396.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0</text><text x="64.0" y="333.8" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">25</text><text x="64.0" y="271.7" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">50</text><text x="64.0" y="209.5" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">75</text><text x="64.0" y="147.3" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">100</text><text x="64.0" y="85.2" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">125</text><text x="74.0" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">-1.0</text><text x="224.2" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">-0.5</text><text x="374.5" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0</text><text x="524.8" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">+0.5</text><text x="675.0" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">+1.0</text><text x="374.5" y="445.0" font-size="10.5" fill="#52614b" text-anchor="middle" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="1.4">SPEARMAN'S RHO: SEASON SCORE AGAINST WINDOW RAINFALL</text><text x="17.0" y="243.0" font-size="10.5" fill="#52614b" text-anchor="middle" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="1.4" transform="rotate(-90 17.0 243.0)">PLACE-CROP PAIRS</text><rect x="285.4" y="389.5" width="28.0" height="2.5" fill="#52614b" fill-opacity="0.5"/><rect x="375.5" y="387.0" width="28.1" height="5.0" fill="#52614b" fill-opacity="0.5"/><rect x="405.6" y="377.1" width="28.0" height="14.9" fill="#52614b" fill-opacity="0.5"/><rect x="435.6" y="307.5" width="28.1" height="84.5" fill="#52614b" fill-opacity="0.5"/><rect x="465.7" y="347.2" width="28.0" height="44.8" fill="#52614b" fill-opacity="0.5"/><rect x="495.7" y="367.1" width="28.1" height="24.9" fill="#52614b" fill-opacity="0.5"/><rect x="525.8" y="347.2" width="28.0" height="44.8" fill="#334c37" fill-opacity="0.85"/><rect x="555.8" y="280.1" width="28.0" height="111.9" fill="#334c37" fill-opacity="0.85"/><rect x="585.8" y="125.9" width="28.1" height="266.1" fill="#334c37" fill-opacity="0.85"/><rect x="615.9" y="227.9" width="28.0" height="164.1" fill="#334c37" fill-opacity="0.85"/><rect x="645.9" y="369.6" width="28.1" height="22.4" fill="#334c37" fill-opacity="0.85"/><line x1="592.5" y1="94.0" x2="592.5" y2="392.0" stroke="#8c6928" stroke-width="1.6" stroke-dasharray="5 4"/><text x="598.5" y="106.0" font-size="10.5" fill="#8c6928" text-anchor="start" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">median 0.73</text><text x="693.0" y="108.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Near 1</text><text x="693.0" y="126.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">water is the binding</text><text x="693.0" y="142.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">condition and the</text><text x="693.0" y="158.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">score tracks the rain.</text><text x="693.0" y="188.0" font-size="11.5" fill="#26392c" text-anchor="start" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Near 0 or absent</text><text x="693.0" y="206.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">soil pH or texture</text><text x="693.0" y="222.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">caps the score in</text><text x="693.0" y="238.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">every year, so rain</text><text x="693.0" y="254.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">cannot move it.</text><text x="74.0" y="456.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Pairs whose score never varies have no rho and are absent here. A high median is expected: water is the only condition that changes by season.</text></svg>