<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400"><rect width="880" height="400" fill="#f0f1e9"/><text x="260" y="46" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">A DECISION STILL OPEN</text><text x="260" y="80" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">The cost of one number we chose ourselves</text><text x="260" y="99" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">A soil a crop's sheet only tolerates scores 0.5 — our figure, with no source — and that is below the 0.6 pass mark, so it fails alone.</text><rect x="260.0" y="112.2" width="447.6" height="34.0" fill="#d8dfcf" fill-opacity="0.9"/><text x="248.0" y="134.2" font-size="12.5" fill="#26392c" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Rated pairs on such a soil</text><text x="717.6" y="134.2" font-size="13" fill="#26392c" text-anchor="start" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">133</text><rect x="260.0" y="194.9" width="2.0" height="34.0" fill="#a05143" fill-opacity="0.9"/><text x="248.0" y="216.9" font-size="12.5" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Good in half the years, as it stands</text><text x="270.0" y="216.9" font-size="13" fill="#26392c" text-anchor="start" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0</text><rect x="260.0" y="277.5" width="144.7" height="34.0" fill="#334c37" fill-opacity="0.9"/><text x="248.0" y="299.5" font-size="12.5" fill="#26392c" text-anchor="end" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Good in half the years, texture left out</text><text x="414.7" y="299.5" font-size="13" fill="#26392c" text-anchor="start" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">43</text><line x1="260.0" y1="100.0" x2="260.0" y2="314.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="260.0" y="348.0" font-size="13" fill="#075a32" text-anchor="start" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">43 place-crop pairs turn on this one constant.</text><text x="260.0" y="396.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Not an argument for dropping it. It is the size of the decision, so that whoever settles the number knows what rests on it. Column good_years_if_texture_left_out in crop_by_place.csv.</text></svg>