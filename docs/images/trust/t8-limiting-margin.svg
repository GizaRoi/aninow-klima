<svg xmlns="http://www.w3.org/2000/svg" width="880" height="460" viewBox="0 0 880 460"><rect width="880" height="460" fill="#f0f1e9"/><text x="74" y="40" font-size="9.5" font-weight="650" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="2.6">WHAT THE MINIMUM THROWS AWAY</text><text x="74" y="74" font-size="19" font-weight="550" fill="#223024" font-family="Manrope, 'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.6">How close the limiting call was</text><text x="74" y="93" font-size="12.5" fill="#52614b" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="-0.1">Suitability reports only the weakest condition. This is the gap to the second weakest, over 471 rated pairs.</text><line x1="74.0" y1="392.0" x2="680.0" y2="392.0" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="290.4" x2="680.0" y2="290.4" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="188.9" x2="680.0" y2="188.9" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="87.3" x2="680.0" y2="87.3" stroke="#d8dfcf" stroke-width="1.0"/><line x1="74.0" y1="392.0" x2="680.0" y2="392.0" stroke="#d8dfcf" stroke-width="1.4"/><text x="64.0" y="396.0" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0</text><text x="64.0" y="294.4" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">50</text><text x="64.0" y="192.9" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">100</text><text x="64.0" y="91.3" font-size="11.5" fill="#52614b" text-anchor="end" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">150</text><text x="74.0" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0.00</text><text x="225.5" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0.25</text><text x="377.0" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0.50</text><text x="528.5" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0.75</text><text x="680.0" y="412.0" font-size="11.5" fill="#52614b" text-anchor="middle" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">1.00</text><text x="377.0" y="445.0" font-size="10.5" fill="#52614b" text-anchor="middle" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="1.4">GAP BETWEEN THE WEAKEST AND SECOND-WEAKEST CONDITION</text><text x="17.0" y="243.0" font-size="10.5" fill="#52614b" text-anchor="middle" font-weight="650" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif" letter-spacing="1.4" transform="rotate(-90 17.0 243.0)">PLACE-CROP PAIRS</text><rect x="75.0" y="125.9" width="28.3" height="266.1" fill="#8c6928" fill-opacity="0.9"/><rect x="105.3" y="300.6" width="28.3" height="91.4" fill="#334c37" fill-opacity="0.7"/><rect x="135.6" y="337.2" width="28.3" height="54.8" fill="#334c37" fill-opacity="0.7"/><rect x="165.9" y="329.0" width="28.3" height="63.0" fill="#334c37" fill-opacity="0.7"/><rect x="196.2" y="361.5" width="28.3" height="30.5" fill="#334c37" fill-opacity="0.7"/><rect x="226.5" y="353.4" width="28.3" height="38.6" fill="#334c37" fill-opacity="0.7"/><rect x="256.8" y="357.5" width="28.3" height="34.5" fill="#334c37" fill-opacity="0.7"/><rect x="287.1" y="367.6" width="28.3" height="24.4" fill="#334c37" fill-opacity="0.7"/><rect x="317.4" y="341.2" width="28.3" height="50.8" fill="#334c37" fill-opacity="0.7"/><rect x="347.7" y="379.8" width="28.3" height="12.2" fill="#334c37" fill-opacity="0.7"/><rect x="378.0" y="290.4" width="28.3" height="101.6" fill="#334c37" fill-opacity="0.7"/><rect x="408.3" y="357.5" width="28.3" height="34.5" fill="#334c37" fill-opacity="0.7"/><rect x="438.6" y="343.3" width="28.3" height="48.7" fill="#334c37" fill-opacity="0.7"/><rect x="468.9" y="367.6" width="28.3" height="24.4" fill="#334c37" fill-opacity="0.7"/><rect x="499.2" y="359.5" width="28.3" height="32.5" fill="#334c37" fill-opacity="0.7"/><rect x="529.5" y="385.9" width="28.3" height="6.1" fill="#334c37" fill-opacity="0.7"/><rect x="559.8" y="385.9" width="28.3" height="6.1" fill="#334c37" fill-opacity="0.7"/><rect x="590.1" y="390.0" width="28.3" height="2.0" fill="#334c37" fill-opacity="0.7"/><rect x="620.4" y="383.9" width="28.3" height="8.1" fill="#334c37" fill-opacity="0.7"/><rect x="650.7" y="365.6" width="28.3" height="26.4" fill="#334c37" fill-opacity="0.7"/><text x="698.0" y="108.0" font-size="11.5" fill="#8c6928" text-anchor="start" font-weight="600" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Left-hand bar</text><text x="698.0" y="126.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">131 pairs where two</text><text x="698.0" y="142.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">conditions are within</text><text x="698.0" y="158.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">0.05 of each other.</text><text x="698.0" y="174.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Naming one of them</text><text x="698.0" y="190.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">'the' limit overstates</text><text x="698.0" y="206.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">how separable they are.</text><text x="698.0" y="236.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">A wide gap means the</text><text x="698.0" y="252.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">limit is unambiguous</text><text x="698.0" y="268.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">and fixing it would</text><text x="698.0" y="284.0" font-size="11.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">really move the score.</text><text x="74.0" y="456.0" font-size="10.5" fill="#52614b" text-anchor="start" font-weight="400" font-family="'DM Sans', -apple-system, 'Segoe UI', sans-serif">Drawn from the median condition scores, so it describes the typical season rather than any single one.</text></svg>