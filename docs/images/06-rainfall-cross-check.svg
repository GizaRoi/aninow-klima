ont-size="11" fill="#5d655a" text-anchor="start" font-weight="400" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">Every shortfall in the model is rainfall subtracted from demand, so this spread passes straight into it. POWER's header labels that column MERRA-2, so this is not yet an IMERG check.</text></svg>