font-size="17" fill="#9db59a" letter-spacing="3" font-family="'Cascadia Mono','Consolas',monospace">ANINOW KLIMA</text><text x="60.0" y="84.0" font-size="44" fill="#ffd84a" text-anchor="start" font-weight="700" font-family="'DM Sans','Segoe UI',Arial,sans-serif">The whole model, in five lines</text><rect x="60.0" y="130.0" width="1160.0" height="470.0" rx="16" fill="#163524" stroke="#2c4a36" stroke-width="2"/><text x="100.0" y="205.0" font-size="26" fill="#9db59a" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">Season score</text><text x="380.0" y="205.0" font-size="36" fill="#8fd05a" text-anchor="start" font-weight="700" font-family="'DM Sans','Segoe UI',Arial,sans-serif">S  =  min( Temperature, Water, Soil pH, Soil texture )</text><text x="100.0" y="291.0" font-size="26" fill="#9db59a" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">Water</text><text x="380.0" y="291.0" font-size="36" fill="#f2c14e" text-anchor="start" font-weight="700" font-family="'DM Sans','Segoe UI',Arial,sans-serif">W  =  min( 1,  Rain ÷ ETc )</text><text x="100.0" y="377.0" font-size="26" fill="#9db59a" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">Crop water need</text><text x="380.0" y="377.0" font-size="36" fill="#eef3e2" text-anchor="start" font-weight="700" font-family="'DM Sans','Segoe UI',Arial,sans-serif">ETc  =  Σ  Kc(day) × ETo(day)        FAO-56</text><text x="100.0" y="463.0" font-size="26" fill="#9db59a" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">Reference ET</text><text x="380.0" y="463.0" font-size="36" fill="#9db59a" text-anchor="start" font-weight="700" font-family="'DM Sans','Segoe UI',Arial,sans-serif">ETo  =  0.0023 (Tmean + 17.8) √(Tmax − Tmin) · Ra</text><text x="100.0" y="549.0" font-size="26" fill="#9db59a" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">Good year</text><text x="380.0" y="549.0" font-size="36" fill="#8fd05a" text-anchor="start" font-weight="700" font-family="'DM Sans','Segoe UI',Arial,sans-serif">S  ≥  0.6</text><text x="60.0" y="670.0" font-size="20" fill="#9db59a" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">Limits from FAO EcoCrop; Kc from FAO-56; rain, temperature and Ra from NASA POWER.</text><text x="60.0" y="698.0" font-size="16" fill="#6f8a70" text-anchor="start" font-weight="400" font-family="'DM Sans','Segoe UI',Arial,sans-serif">AniNow Klima · NASA POWER, 1981–2024 · past seasons, not a forecast</text></svg>